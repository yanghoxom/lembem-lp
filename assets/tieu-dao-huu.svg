<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 680" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Tiểu đạo hữu tiễn biệt</title>
<desc id="desc">Một tiểu đạo hữu chibi mặc cổ phục màu xanh trà, tóc búi, mỉm cười vẫy tay giữa núi non thủy mặc và những cành trúc, phong cách tranh giấy cũ.</desc>
<defs>
  <radialGradient id="sun" cx="0" cy="0" r="1" gradientTransform="translate(372 272) rotate(90) scale(276)">
    <stop stop-color="#F6E8C9"/><stop offset=".7" stop-color="#E8D9B8"/><stop offset="1" stop-color="#D9C9A8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mount" x1="350" y1="312" x2="350" y2="535" gradientUnits="userSpaceOnUse">
    <stop stop-color="#718486" stop-opacity=".62"/><stop offset="1" stop-color="#9CA6A0" stop-opacity=".08"/>
  </linearGradient>
  <linearGradient id="robe" x1="280" y1="371" x2="455" y2="574" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7D9B99"/><stop offset=".53" stop-color="#66817F"/><stop offset="1" stop-color="#465D61"/>
  </linearGradient>
  <linearGradient id="outer" x1="323" y1="178" x2="452" y2="367" gradientUnits="userSpaceOnUse">
    <stop stop-color="#485151"/><stop offset="1" stop-color="#27373B"/>
  </linearGradient>
  <linearGradient id="face" x1="305" y1="235" x2="430" y2="367" gradientUnits="userSpaceOnUse">
    <stop stop-color="#F9E6CC"/><stop offset="1" stop-color="#E8C8A9"/>
  </linearGradient>
  <linearGradient id="sleeve" x1="448" y1="357" x2="545" y2="325" gradientUnits="userSpaceOnUse">
    <stop stop-color="#91AAA5"/><stop offset="1" stop-color="#5D7D7C"/>
  </linearGradient>
  <filter id="inkSoft"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" seed="12" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".075"/></feComponentTransfer></filter>
  <clipPath id="scene"><circle cx="371" cy="302" r="262"/></clipPath>
</defs>
